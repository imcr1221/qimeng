name: Generate Audio from Texts

on:
  push:
    paths:
      - '**/*.html' # 👈 监控所有目录下的 HTML 变化
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 edge-tts

      - name: Run audio generation script
        run: python generate_audio.py 

      - name: Commit and push generated audio files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 👈 把所有模块下的 audio 文件夹都加进去
          git add */audio/
          git commit -m "Auto-generate audio files" || exit 0
          git push
