{answer:'doctor',text:'小朋友生病了，谁给他看病？',emoji:'🤒'},

{answer:'driver',text:'我想坐公交车，谁来开车？',emoji:'🚌'}]);return []}
function header(name,total){return `<div class="heading"><h2>${name}</h2><span class="progress">${idx+1} / ${total}</span></div>`}
function footer(){return `<div class="feedback" id="feedback"></div><div class="actions"><button class="btn" onclick="previous()" ${idx===0?'disabled':''}>← 上一题</button><button class="btn primary" id="next" onclick="next()" disabled>下一题 →</button></div>`}
function render(){if(tab==='learn')return learn();if(tab==='sentence')return sentence();let q=questions[idx];if(!q)return finish();let opts=shuffle([jBy(q.answer),...shuffle(mainJobs.filter(j=>j.id!==q.answer)).slice(0,3)]);let title=Object.fromEntries(tabs)[tab];panel.innerHTML=header(title,questions.length)+`<p class="hint">${tab==='listen'?'听职业名称，点击正确的图片。':tab==='guess'?'听线索，猜猜是谁。':'听一听，再选一选。'}</p>`+(q.emoji?`<div class="question" style="font-size:65px">${q.emoji}</div>`:'')+(tab==='listen'?`<div class="question inline-reading">${speak(q.text,'🔊 听职业')}</div>`:`<div class="question inline-reading">${safe(q.text)} ${speak(q.text,'🔊')}</div>`)+`<div class="grid">${opts.map(option).join('')}</div>`+footer()}
function answer(id){if(locked)return;let q=questions[idx],el=document.querySelector(`[data-answer="${id}"]`);if(id===q.answer){locked=true;el.classList.add('correct');document.getElementById('feedback').textContent=['match','guess','help'].includes(tab)?'🎉 '+jBy(id).name+'！答对了，你真棒！':'🎉 答对啦，你真棒！';document.getElementById('next').disabled=false;tts(['match','guess','help'].includes(tab)?jBy(id).name+'！答对了，你真棒！':'答对啦，你真棒！')}else{el.classList.add('wrong');document.getElementById('feedback').textContent='再想一想，试试看！';tts('再想一想，试试看！')}}
function next(){if(!locked)return;idx++;locked=false;render()}
function previous(){if(idx<=0)return;idx--;locked=false;render()}
function learn(){let j=jobs[idx];panel.innerHTML=header('👀 认识职业',jobs.length)+`<p class="hint">看图片，听一听，跟着说一说。</p><img class="photo" src="assets/${j.id==='singer'?'singer.jpg':'slide'+j.slide+'.jpg'}" alt="${j.name}课堂插画"><div class="question inline-reading">${j.name} ${speak(j.name,'🔊')}</div><p class="sentence inline-reading">${j.name}：${j.work}。 ${speak(j.name+'，'+j.work+'。','🔊')}</p><div class="actions"><button class="btn" onclick="idx=(idx+jobs.length-1)%jobs.length;render()">← 上一个</button><button class="btn primary" onclick="idx=(idx+1)%jobs.length;render()">下一个 →</button></div>`}
const sentenceQs=[
{subject:'西瓜',slide:42,question:'西瓜怎么样？',right:'又大又甜',wrong:['又大又小','又冷又热']},
{subject:'小猫',slide:43,question:'小猫怎么样？',right:'又小又可爱',wrong:['又大又小','又黑又冷']},
{subject:'小女孩',slide:44,question:'小女孩在干什么？',right:'又唱又跳',wrong:['又吃又睡','又哭又笑']},
{subject:'小男孩',slide:45,question:'小男孩怎么了？',right:'又累又饿',wrong:['又唱又跳','又大又甜']},
{subject:'外面',slide:46,question:'外面怎么样？',right:'又黑又冷',wrong:['又大又甜','又唱又跳']},
{subject:'蛋糕',slide:47,question:'蛋糕怎么样？',right:'又大又好吃',wrong:['又小又冷','又黑又累']},
{subject:'小女孩',slide:44,question:'看一看，小女孩正在做什么？',right:'又唱又跳',wrong:['又吃又睡','又冷又饿']},
{subject:'小男孩',slide:45,question:'小男孩现在感觉怎么样？',right:'又累又饿',wrong:['又大又甜','又唱又跳']}];
function sentence(){let q=sentenceQs[idx];if(!q)return finish();let choices=shuffle([q.right,...q.wrong]);panel.innerHTML=header('💬 又……又……',sentenceQs.length)+`<p class="hint">先看图，再听每个选项，选出合适的句子。</p><img class="photo" src="assets/slide${q.slide}.jpg" alt="${q.subject}"><div class="question inline-reading">${safe(q.question)} ${speak(q.question,'🔊')}</div><div class="choices">${choices.map((c,i)=>`<div class="choice" data-choice="${safe(c)}"><button class="pick" onclick="choose(${i})">${safe(q.subject+c)}。</button>${speak(q.subject+c+'。','🔊')}</div>`).join('')}</div>`+footer()}
function choose(i){if(locked)return;let q=sentenceQs[idx],el=document.querySelectorAll('.choice')[i],s=el.dataset.choice;if(s===q.right){locked=true;el.classList.add('correct');document.getElementById('feedback').textContent='🎉 答对啦！'+q.subject+q.right+'！';document.getElementById('next').disabled=false;tts(q.subject+q.right+'。')}else{el.classList.add('wrong');document.getElementById('feedback').textContent='再听一听，想一想！';tts('再想一想，试试看！')}}
function finish(){panel.innerHTML=`<div class="complete">🏆</div><h2 class="center">闯关完成！你真棒！</h2><p class="hint">可以再玩一次，也可以换一个游戏。</p><div class="actions"><button class="btn primary" onclick="go('${tab}')">再玩一次</button><button class="btn" onclick="go('learn')">认识职业</button></div>`}
navigation();render();
</script></body></html>
